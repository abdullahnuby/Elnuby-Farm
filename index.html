<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<title>المجدول — نظام إدارة مزرعة نخيل التمر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="login"></div>

<div id="app">
 <header id="topbar">
  <div class="tb-brand" id="tbbrand"></div>
  <div class="qwrap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>
  <input id="q" placeholder="ابحث برقم النخلة — مثال: A01-R05-P027" onkeydown="if(event.key==='Enter')App.searchGo()"></div>
  <span id="clk"></span>
  <div class="bell-w"><button class="ibtn" onclick="App.bell(event)" id="bellbtn"></button><div class="bell-dd" id="belldd"></div></div>
  <div class="uchip" id="uchip"></div>
  <button class="ibtn" title="تسجيل الخروج" onclick="App.logout()" id="logoutbtn"></button>
 </header>
 <div id="body">
  <aside id="sidebar">
   <div class="brand" id="brand"></div>
   <nav id="nav"></nav>
   <div class="sidefoot"><span class="dotg"></span>قاعدة بيانات محلية — متصلة<br>Medjool FMS · v2.0 Desktop</div>
  </aside>
  <main id="page"><div class="wrap" id="pagewrap"></div></main>
 </div>
 <footer id="statusbar"></footer>
</div>

<div id="tip"></div>
<div id="modal-root"></div>
<div id="toasts"></div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/pages.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
